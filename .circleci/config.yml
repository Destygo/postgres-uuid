# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

orbs:
    docker: circleci/docker@2.2.0

executors:
    docker_executor:
        docker:
            - image: cimg/base:2023.12
        resource_class: medium
        working_directory: ~/repo

jobs:
    build_image:
        executor: docker_executor
        steps:
            - checkout
            - setup_remote_docker:
                  docker_layer_caching: true
            - run:
                  name: Docker login
                  command: |
                      echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            - run:
                  name: Build Docker image
                  command: |
                      # Build the image
                      docker build \
                        --tag postgres-uuid:latest \
                        .
            - run:
                  name: Test Docker image
                  command: |
                      # Test that the image can be run and the extension is available
                      docker run --rm \
                        -e POSTGRES_PASSWORD=test \
                        -e POSTGRES_DB=testdb \
                        --name test-postgres-uuid \
                        postgres-uuid:latest &
                      
                      # Wait for PostgreSQL to start
                      sleep 10
                      
                      # Test that the UUID extension is available
                      docker exec test-postgres-uuid psql -U postgres -d testdb -c "SELECT uuid_generate_v4();" || exit 1
                      
                      # Cleanup
                      docker stop test-postgres-uuid
            - run:
                  name: Push Docker image
                  command: |
                      # Tag with your Docker Hub username
                      docker tag postgres-uuid:latest $DOCKERHUB_USERNAME/postgres-uuid:latest
                      
                      # Push to Docker Hub
                      docker push $DOCKERHUB_USERNAME/postgres-uuid:latest

workflows:
    # Main build pipeline
    build:
        jobs:
            - build_image:
                  context: docker-build